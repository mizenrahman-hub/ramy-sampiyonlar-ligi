name: Verify Cloudflare access
on:
  push:
    paths:
      - .github/workflows/cloudflare-access.yml
  workflow_dispatch:
permissions: {}
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Verify updated token without printing it
        run: |
          test -n "$CF_TOKEN" || { echo "Cloudflare secret missing"; exit 1; }
          body=$(mktemp)
          trap 'rm -f "$body"' EXIT
          status=$(curl --silent --show-error --max-time 20 -o "$body" -w '%{http_code}' \
            -H "Authorization: Bearer $CF_TOKEN" \
            https://api.cloudflare.com/client/v4/user/tokens/verify)
          echo "Cloudflare HTTP status: $status"
          jq -r '(.errors // [])[] | .code | numbers | "Cloudflare error code: \(.)"' "$body"
          jq -e '.success == true and .result.status == "active"' "$body"
      - name: Check Worker and D1 access
        run: |
          api=https://api.cloudflare.com/client/v4
          cf() { curl -fsS --max-time 20 -H "Authorization: Bearer $CF_TOKEN" "$api/$1"; }
          account=$(cf 'accounts?per_page=50' | jq -er '.result | if length == 1 then .[0].id else error("Expected one accessible account") end')
          cf "accounts/$account/workers/scripts/ramy-sampiyonlar-ligi-api/settings" |
            jq -e '.success == true' >/dev/null
          echo "Worker settings accessible"
          cf "accounts/$account/d1/database?name=ramy-sampiyonlar-ligi-db" |
            jq -e 'any(.result[]; .name == "ramy-sampiyonlar-ligi-db")' >/dev/null
          echo "D1 database accessible"
      - name: Record production rollback points
        run: |
          api=https://api.cloudflare.com/client/v4
          cf() { curl -fsS --max-time 20 -H "Authorization: Bearer $CF_TOKEN" "$api/$1"; }
          account=$(cf 'accounts?per_page=50' | jq -er '.result[0].id')
          database=$(cf "accounts/$account/d1/database?name=ramy-sampiyonlar-ligi-db" | jq -er '.result[] | select(.name=="ramy-sampiyonlar-ligi-db") | .uuid')
          cf "accounts/$account/workers/scripts/ramy-sampiyonlar-ligi-api/deployments" |
            jq -ce '.result.deployments[0] | {id,versions} | select(.id and (.versions|length>0))' > worker-rollback.json
          cf "accounts/$account/d1/database/$database/time_travel/bookmark" |
            jq -er '.result.bookmark | select(length>0)' > d1-bookmark.txt
          echo "Worker deployment and D1 restore bookmark recorded"
      - uses: actions/upload-artifact@v4
        with:
          name: ramy-cloudflare-rollback-points
          path: |
            worker-rollback.json
            d1-bookmark.txt
