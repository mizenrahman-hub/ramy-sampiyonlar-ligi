name: Verify Cloudflare access
on:
  push:
    paths:
      - .github/workflows/cloudflare-access.yml
  workflow_dispatch:
permissions: {}
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Verify token without printing it
        run: |
          test -n "$CF_TOKEN" || { echo "Cloudflare secret missing"; exit 1; }
          curl --silent --show-error --fail --max-time 20 \
            -H "Authorization: Bearer $CF_TOKEN" \
            https://api.cloudflare.com/client/v4/user/tokens/verify |
            jq -e '.success == true and .result.status == "active"'
