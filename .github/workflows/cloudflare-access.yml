name: Verify Cloudflare access
on:
  push:
    paths:
      - .github/workflows/cloudflare-access.yml
  workflow_dispatch:
permissions: {}
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Verify updated token without printing it
        run: |
          test -n "$CF_TOKEN" || { echo "Cloudflare secret missing"; exit 1; }
          body=$(mktemp)
          trap 'rm -f "$body"' EXIT
          status=$(curl --silent --show-error --max-time 20 -o "$body" -w '%{http_code}' \
            -H "Authorization: Bearer $CF_TOKEN" \
            https://api.cloudflare.com/client/v4/user/tokens/verify)
          echo "Cloudflare HTTP status: $status"
          jq -r '(.errors // [])[] | .code | numbers | "Cloudflare error code: \(.)"' "$body"
          jq -e '.success == true and .result.status == "active"' "$body"
