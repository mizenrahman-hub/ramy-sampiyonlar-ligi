name: Verify Cloudflare access
on:
  push:
    paths:
      - .github/workflows/cloudflare-access.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Verify updated token without printing it
        run: |
          test -n "$CF_TOKEN" || { echo "Cloudflare secret missing"; exit 1; }
          body=$(mktemp)
          trap 'rm -f "$body"' EXIT
          status=$(curl --silent --show-error --max-time 20 -o "$body" -w '%{http_code}' \
            -H "Authorization: Bearer $CF_TOKEN" \
            https://api.cloudflare.com/client/v4/user/tokens/verify)
          echo "Cloudflare HTTP status: $status"
          jq -r '(.errors // [])[] | .code | numbers | "Cloudflare error code: \(.)"' "$body"
          jq -e '.success == true and .result.status == "active"' "$body"
      - name: Check Worker and D1 access
        run: |
          api=https://api.cloudflare.com/client/v4
          cf() { curl -fsS --max-time 20 -H "Authorization: Bearer $CF_TOKEN" "$api/$1"; }
          account=$(cf 'accounts?per_page=50' | jq -er '.result | if length == 1 then .[0].id else error("Expected one accessible account") end')
          cf "accounts/$account/workers/scripts/ramy-sampiyonlar-ligi-api/settings" |
            jq -e '.success == true' >/dev/null
          echo "Worker settings accessible"
          cf "accounts/$account/d1/database?name=ramy-sampiyonlar-ligi-db" |
            jq -e 'any(.result[]; .name == "ramy-sampiyonlar-ligi-db")' >/dev/null
          echo "D1 database accessible"
      - name: Record production rollback points
        run: |
          api=https://api.cloudflare.com/client/v4
          cf() { curl -fsS --max-time 20 -H "Authorization: Bearer $CF_TOKEN" "$api/$1"; }
          account=$(cf 'accounts?per_page=50' | jq -er '.result[0].id')
          database=$(cf "accounts/$account/d1/database?name=ramy-sampiyonlar-ligi-db" | jq -er '.result[] | select(.name=="ramy-sampiyonlar-ligi-db") | .uuid')
          cf "accounts/$account/workers/scripts/ramy-sampiyonlar-ligi-api/deployments" |
            jq -ce '.result.deployments[0] | {id,versions} | select(.id and (.versions|length>0))' > worker-rollback.json
          cf "accounts/$account/d1/database/$database/time_travel/bookmark" |
            jq -er '.result.bookmark | select(length>0)' > d1-bookmark.txt
          echo "Worker deployment and D1 restore bookmark recorded"
      - uses: actions/upload-artifact@v4
        with:
          name: ramy-cloudflare-rollback-points
          path: |
            worker-rollback.json
            d1-bookmark.txt
      - uses: actions/checkout@v4
      - name: Deploy Worker preserving existing bindings
        run: |
          node --input-type=module --check < worker.js
          api=https://api.cloudflare.com/client/v4
          cf() { curl -fsS --max-time 30 -H "Authorization: Bearer $CF_TOKEN" "$api/$1"; }
          account=$(cf 'accounts?per_page=50' | jq -er '.result[0].id')
          database=$(cf "accounts/$account/d1/database?name=ramy-sampiyonlar-ligi-db" | jq -er '.result[] | select(.name=="ramy-sampiyonlar-ligi-db") | .uuid')
          worker="$api/accounts/$account/workers/scripts/ramy-sampiyonlar-ligi-api"
          cf "accounts/$account/workers/scripts/ramy-sampiyonlar-ligi-api/settings" |
            jq -e --arg db "$database" '
              .result as $s |
              {main_module:"worker.js", compatibility_date:$s.compatibility_date,
               compatibility_flags:($s.compatibility_flags // []), keep_bindings:["secret_text","secret_key"],
               bindings:([($s.bindings // [])[] | select(.name!="DB" and .type!="secret_text" and .type!="secret_key") | {name,type:"inherit"}] + [{name:"DB",type:"d1",id:$db}]),
               keep_assets:true, inherit_bindings:"strict"}' > metadata.json
          curl -sS --max-time 60 -X PUT -H "Authorization: Bearer $CF_TOKEN" \
            -F 'metadata=@metadata.json;type=application/json' \
            -F 'worker.js=@worker.js;type=application/javascript+module' "$worker" |
            jq -e 'if .success then true else (.errors | map(.code)), false end'
      - name: Verify public API
        run: |
          origin=https://ramy-sampiyonlar-ligi-api.mizenrahman.workers.dev
          curl -fsS --retry 3 "$origin/health" | jq -e '.database == "connected"'
          curl -fsS "$origin/leaders" | jq -e '(.day|type=="array") and (.week|type=="array") and (.recent|type=="array")'
      - name: Enable scheduled Super Chat polling
        run: |
          api=https://api.cloudflare.com/client/v4
          auth="Authorization: Bearer $CF_TOKEN"
          account=$(curl -fsS -H "$auth" "$api/accounts?per_page=50" | jq -er '.result[0].id')
          endpoint="$api/accounts/$account/workers/scripts/ramy-sampiyonlar-ligi-api"
          curl -fsS -H "$auth" "$endpoint/settings" | jq -e '
            [.result.bindings[] | select(.type=="secret_text") | .name] as $names |
            all(["YOUTUBE_CLIENT_ID","YOUTUBE_CLIENT_SECRET","YOUTUBE_REFRESH_TOKEN"][]; . as $name | $names | index($name) != null)'
          schedules=$(curl -fsS -H "$auth" "$endpoint/schedules" | jq -ce '.result.schedules | map({cron})')
          if [ "$schedules" = '[]' ]; then
            curl -fsS -X PUT -H "$auth" -H 'Content-Type: application/json' \
              --data '[{"cron":"*/2 * * * *"}]' "$endpoint/schedules" | jq -e '.success'
          fi
          curl -fsS -H "$auth" "$endpoint/schedules" | jq -e '.result.schedules | length > 0'

