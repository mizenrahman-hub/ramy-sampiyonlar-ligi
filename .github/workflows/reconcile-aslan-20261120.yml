name: Reconcile verified Aslan Kaan support
on:
  push:
    paths:
      - .github/workflows/reconcile-aslan-20261120.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Reconcile one Studio-verified donation without duplicates
        shell: bash
        run: |
          python - <<'PY'
          import os,json,urllib.request
          token=os.environ["CF_TOKEN"]
          account="c83690541bc95e8a9c04a1056f76e84c"
          base="https://api.cloudflare.com/client/v4/"
          def api(path,payload=None):
              data=None if payload is None else json.dumps(payload).encode()
              req=urllib.request.Request(base+path,data=data,headers={"Authorization":"Bearer "+token,"Content-Type":"application/json"})
              with urllib.request.urlopen(req,timeout=30) as res: result=json.load(res)
              if not result.get("success"): raise RuntimeError("Cloudflare request failed")
              return result["result"]
          dbs=api("accounts/"+account+"/d1/database?name=ramy-sampiyonlar-ligi-db")
          matches=[d for d in dbs if d["name"]=="ramy-sampiyonlar-ligi-db"]
          assert len(matches)==1,"Expected one database"
          db=matches[0]["uuid"]
          def query(sql,params=[]):
              result=api("accounts/"+account+"/d1/database/"+db+"/query",{"sql":sql,"params":params})
              assert all(r.get("success") for r in result),"D1 query failed"
              return result
          author="UC110_WcAKZdzcLJqYJnysFQ"
          record="manual:studio:YTz1KUF1QSc:"+author+":TRY:499"
          # Verify schema before mutation. A matching amount for this author anywhere
          # is deliberately conservative: do not add if a duplicate is plausible.
          cols=query("PRAGMA table_info(donations)")[0]["results"]
          assert {"id","supporter_id","supporter_name","amount_original","currency","amount_try","message","donated_at"} <= {c["name"] for c in cols}
          existing=query("SELECT COUNT(*) AS n FROM donations WHERE id=? OR (supporter_id=? AND currency='TRY' AND ABS(amount_original-4.99)<0.001)",[record,author])[0]["results"][0]["n"]
          if existing:
              print("Verified matching donation already exists; no insert.")
          else:
              # Date-only value records the verified broadcast date without inventing
              # an exact transaction timestamp. Source and limitation retained in message.
              note="Manual reconciliation: YouTube Studio Supers history; video YTz1KUF1QSc; broadcast date 2026-11-20; exact transaction time unavailable."
              result=query("INSERT OR IGNORE INTO donations (id,supporter_id,supporter_name,amount_original,currency,amount_try,message,donated_at) SELECT ?,?,?,4.99,'TRY',4.99,?,? WHERE NOT EXISTS (SELECT 1 FROM donations WHERE supporter_id=? AND currency='TRY' AND ABS(amount_original-4.99)<0.001)",[record,author,"Aslan Kaan",note,"2026-11-20",author])
              print("Inserted rows:",result[0]["meta"].get("changes",0))
          verified=query("SELECT COUNT(*) AS n,ROUND(SUM(amount_try),2) AS total_try FROM donations WHERE supporter_id=? AND currency='TRY' AND ABS(amount_original-4.99)<0.001",[author])[0]["results"][0]
          assert verified["n"]>=1,"Donation verification failed"
          print("Confirmed matching records:",verified["n"],"; TRY total:",verified["total_try"])
          PY
