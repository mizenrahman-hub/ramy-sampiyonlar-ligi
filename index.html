<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ramy Şampiyonlar Ligi</title><style>*{box-sizing:border-box}body{margin:0;background:transparent;color:#fff;font-family:Arial,sans-serif}.wrap{padding:12px;display:grid;grid-template-columns:1fr 1fr;gap:10px}.panel{border:2px solid #d7a93c;background:rgba(12,16,27,.91);border-radius:16px;padding:12px;text-align:center;min-height:125px;box-shadow:0 4px 20px #0007}.head{color:#ffd76a;font-size:clamp(11px,3vw,19px);font-weight:800}.name{font-size:clamp(16px,4vw,27px);font-weight:800;margin:12px 0 4px;overflow-wrap:anywhere}.amount{font-size:clamp(16px,4vw,26px);font-weight:bold;color:#ffe6a3}.foot{font-size:11px;color:#b8c0d1;margin-top:7px}.demo{background:#1b2433;color:white;padding:14px;margin:20px 12px;border-radius:12px}.demo label{display:block;margin:10px 0 4px}.demo input,.demo button{width:100%;padding:10px;border-radius:8px;border:0}.demo button{background:#eac45c;margin-top:12px;font-weight:800}.demo small{color:#bbc4d3}body.overlay .demo{display:none}</style></head><body><div class="wrap"><section class="panel"><div class="head">🏆 GÜNÜN ŞAMPİYONU</div><div class="name" id="dailyName">Henüz yok</div><div class="amount" id="dailyAmount">0 TL</div><div class="foot">Bugünkü lider</div></section><section class="panel"><div class="head">👑 HAFTANIN ŞAMPİYONU</div><div class="name" id="weeklyName">Henüz yok</div><div class="amount" id="weeklyAmount">0 TL</div><div class="foot">Haftalık lider</div></section></div><div class="demo"><b>Panel önizleme / manuel test</b><small><p>Bu sürüm otomatik YouTube verisi çekmez. Buraya girilen bilgiler yalnızca bu tarayıcıda saklanır; PRISM'deki ayrı web görünümüne aktarılmaz.</p></small><label>Günün lideri</label><input id="dn" placeholder="Kullanıcı adı"><label>Günlük toplam (TL)</label><input id="da" type="number" min="0" placeholder="0"><label>Haftanın lideri</label><input id="wn" placeholder="Kullanıcı adı"><label>Haftalık toplam (TL)</label><input id="wa" type="number" min="0" placeholder="0"><button onclick="save()">Önizlemeyi güncelle</button><button onclick="location.search='?overlay=1'">Yayın görünümünü göster</button></div><script>const ids=['dn','da','wn','wa'];function render(a){document.getElementById('dailyName').textContent=a[0]||'Henüz yok';document.getElementById('dailyAmount').textContent=(Number(a[1])||0).toLocaleString('tr-TR')+' TL';document.getElementById('weeklyName').textContent=a[2]||'Henüz yok';document.getElementById('weeklyAmount').textContent=(Number(a[3])||0).toLocaleString('tr-TR')+' TL'}function save(){let a=ids.map(id=>document.getElementById(id).value);localStorage.setItem('ramy-preview',JSON.stringify(a));render(a)}let a;try{a=JSON.parse(localStorage.getItem('ramy-preview'))||['','','','']}catch(e){a=['','','','']}ids.forEach((id,i)=>document.getElementById(id).value=a[i]);render(a);if(new URLSearchParams(location.search).has('overlay'))document.body.classList.add('overlay');</script></body></html>
