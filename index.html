<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ramy Şampiyonlar Ligi</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;color:white;font-family:Arial,sans-serif}.leader{position:absolute;top:8%;width:39%;min-height:94px;padding:12px 8px;text-align:center;border:2px solid #d5a74b;border-radius:16px;background:linear-gradient(145deg,rgba(13,19,31,.94),rgba(38,29,18,.92));box-shadow:0 4px 14px #0008,inset 0 1px 5px #ffe5a755}.left{left:2%}.right{right:2%}.head{color:#ffdc83;font-size:clamp(10px,2.6vw,17px);font-weight:900}.name{font-size:clamp(13px,3.5vw,25px);font-weight:800;margin:9px 0 3px;overflow-wrap:anywhere}.amount{font-size:clamp(15px,3.6vw,27px);font-weight:900;color:#ffe1a0}.alert{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%) scale(.7);width:75%;text-align:center;opacity:0;pointer-events:none;transition:opacity .2s,transform .3s;filter:drop-shadow(0 8px 20px #0009)}.alert.show{opacity:1;transform:translate(-50%,-50%) scale(1)}.alertCard{border:3px solid #f5cf70;border-radius:22px;padding:18px;background:radial-gradient(ellipse at 50% 0%,#6d4a1c,#161b2a 75%);box-shadow:inset 0 3px 8px #fff6,0 8px 30px #0009}.trophy{font-size:52px;filter:drop-shadow(3px 6px 2px #0009)}.alertTitle{font-size:18px;color:#ffdf84;font-weight:900}.alertName{font-size:clamp(24px,6vw,42px);font-weight:900}.alertAmount{font-size:clamp(20px,5vw,32px);color:#ffe28e;font-weight:900}.confetti{position:absolute;inset:-40px;overflow:hidden;pointer-events:none}.piece{position:absolute;top:-25px;width:9px;height:15px;background:linear-gradient(135deg,#fff5a1,#b77b1c);border-radius:3px;box-shadow:2px 3px 4px #0006;animation:fall 2.8s linear forwards}@keyframes fall{to{transform:translate3d(var(--dx),340px,0) rotate(720deg);opacity:0}}.rankings{margin-top:9px;display:grid;gap:5px}.rank{display:flex;align-items:center;gap:5px;font-size:clamp(10px,2.2vw,17px);text-align:left;white-space:nowrap}.rank span{overflow:hidden;text-overflow:ellipsis;flex:1}.rank b{color:#ffe1a0;font-size:.9em}.leader{min-height:120px}.alertSubtitle{font-size:clamp(13px,3vw,21px);font-weight:900;color:#ffe8b0;letter-spacing:.09em;margin:6px 0}.alert.legend .alertCard{border-color:#fff0a8;box-shadow:0 0 45px #f8b733aa,inset 0 3px 15px #fff7;animation:legendPulse 1.1s ease-in-out 3}.alert.legend .trophy{font-size:70px}@keyframes legendPulse{50%{transform:scale(1.035);filter:brightness(1.3)}}</style></head><body><section class="leader left"><div class="head">🏆 GÜNÜN ŞAMPİYONU</div><div class="rankings" id="daily"><div class="rank">🥇 <span>Henüz yok</span><b>—</b></div><div class="rank">🥈 <span>Henüz yok</span><b>—</b></div><div class="rank">🥉 <span>Henüz yok</span><b>—</b></div></div></section><section class="leader right"><div class="head">👑 HAFTANIN ŞAMPİYONU</div><div class="rankings" id="weekly"><div class="rank">🥇 <span>Henüz yok</span><b>—</b></div><div class="rank">🥈 <span>Henüz yok</span><b>—</b></div><div class="rank">🥉 <span>Henüz yok</span><b>—</b></div></div></section><div class="alert" id="alert"><div class="confetti" id="confetti"></div><div class="alertCard"><div class="trophy">🏆</div><div class="alertTitle" id="title">SÜPER CHAT!</div><div class="alertSubtitle" id="subtitle"></div><div class="alertName" id="sender"></div><div class="alertAmount" id="money"></div></div></div><script>const q=new URLSearchParams(location.search);function safe(id,v){document.getElementById(id).textContent=v}const money=n=>Number(n||0).toLocaleString('tr-TR')+' TL';function override(board,name,amount){if(name){const el=document.querySelector('#'+board+' .rank span');if(el)el.textContent=name}if(amount!==null){const el=document.querySelector('#'+board+' .rank b');if(el)el.textContent=money(amount)}}override('daily',q.get('day'),q.get('dayAmount'));override('weekly',q.get('week'),q.get('weekAmount'));function sound(){try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return;const c=new C();[523,659,784].forEach((f,i)=>{const o=c.createOscillator(),g=c.createGain(),t=c.currentTime+i*.16;o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.12,t+.025);g.gain.exponentialRampToValueAtTime(.0001,t+.36);o.connect(g).connect(c.destination);o.start(t);o.stop(t+.38)});setTimeout(()=>c.close(),1500)}catch(e){}}function celebrate(name,amount,champ){const n=Number(amount)||0,legend=n>=1000;safe('title',legend?'👑 EFSANE ŞAMPİYON!':champ?'👑 YENİ ŞAMPİYON!':'🎉 SÜPER CHAT!');safe('subtitle',legend?'BU GECEYE DAMGA VURDUN!':n>=500?'SÜPER ŞAMPİYON!':n>=100?'YENİ YILDIZIMIZ SAHNEDE!':'DESTEĞİN İÇİN TEŞEKKÜRLER!');safe('sender',name);safe('money',money(n));const el=document.getElementById('alert'),cf=document.getElementById('confetti');cf.replaceChildren();for(let i=0;i<(legend?80:32);i++){let p=document.createElement('i');p.className='piece';p.style.left=(Math.random()*100)+'%';p.style.animationDelay=(Math.random()*1.5)+'s';p.style.setProperty('--dx',((Math.random()-.5)*250)+'px');cf.appendChild(p)}el.classList.toggle('legend',legend);el.classList.add('show');sound();clearTimeout(window.alertTimeout);window.alertTimeout=setTimeout(()=>{el.classList.remove('show');el.classList.remove('legend')},legend?10000:n>=500?7000:n>=100?5000:3000)}
const API='https://ramy-sampiyonlar-ligi-api.mizenrahman.workers.dev/leaders';function renderRanks(board,items){const el=document.getElementById(board);if(!el)return;el.replaceChildren();const medals=['🥇','🥈','🥉'];for(let i=0;i<3;i++){const row=document.createElement('div');row.className='rank';const item=Array.isArray(items)?items[i]:null;const name=document.createElement('span');name.textContent=item?.name||item?.supporter_name||'Henüz yok';const amount=document.createElement('b');amount.textContent=item&&Number.isFinite(Number(item.amount??item.total_try))?money(item.amount??item.total_try):'—';row.append(document.createTextNode(medals[i]+' '),name,amount);el.append(row)}}const seenDonations = new Map();
const alertQueue = [];
let alertsReady = false;
let playingAlert = false;
let refreshing = false;

function playNextAlert() {
  const donation = alertQueue.shift();
  if (!donation) {
    playingAlert = false;
    return;
  }
  playingAlert = true;
  celebrate(donation.name, donation.amount, false);
  const duration = donation.amount >= 1000 ? 10000 : donation.amount >= 500 ? 7000 : donation.amount >= 100 ? 5000 : 3000;
  setTimeout(playNextAlert, duration + 250);
}

function updateAlerts(recent) {
  if (!Array.isArray(recent)) return;
  const now = Date.now();
  for (const [id, lastSeen] of seenDonations) {
    if (now - lastSeen > 10 * 60_000) seenDonations.delete(id);
  }
  for (const donation of recent.slice().reverse()) {
    if (!donation.id || !Number.isFinite(donation.amount)) continue;
    if (alertsReady && !seenDonations.has(donation.id)) alertQueue.push(donation);
    seenDonations.set(donation.id, now);
  }
  alertsReady = true;
  if (!playingAlert) playNextAlert();
}

async function refreshLeaders(){if(refreshing)return;refreshing=true;try{const response=await fetch(API,{cache:'no-store'});if(!response.ok)throw Error('API '+response.status);const data=await response.json();renderRanks('daily',data.day);renderRanks('weekly',data.week);if(!q.has('test'))updateAlerts(data.recent)}catch(err){console.warn('Liderlik verileri alınamadı',err)}finally{refreshing=false}}refreshLeaders();setInterval(refreshLeaders,15000);if(q.has('test'))setTimeout(()=>celebrate(q.get('sender')||'Örnek İzleyici',q.get('amount')||100,q.has('champ')),700);</script></body></html>
