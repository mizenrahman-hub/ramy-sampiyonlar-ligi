<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ramy Şampiyonlar Ligi</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;color:white;font-family:Arial,sans-serif}.leader{position:absolute;top:8%;width:39%;min-height:94px;padding:12px 8px;text-align:center;border:2px solid #d5a74b;border-radius:16px;background:linear-gradient(145deg,rgba(13,19,31,.94),rgba(38,29,18,.92));box-shadow:0 4px 14px #0008,inset 0 1px 5px #ffe5a755}.left{left:2%}.right{right:2%}.head{color:#ffdc83;font-size:clamp(10px,2.6vw,17px);font-weight:900}.name{font-size:clamp(13px,3.5vw,25px);font-weight:800;margin:9px 0 3px;overflow-wrap:anywhere}.amount{font-size:clamp(15px,3.6vw,27px);font-weight:900;color:#ffe1a0}.alert{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%) scale(.7);width:75%;text-align:center;opacity:0;pointer-events:none;transition:opacity .2s,transform .3s;filter:drop-shadow(0 8px 20px #0009)}.alert.show{opacity:1;transform:translate(-50%,-50%) scale(1)}.alertCard{border:3px solid #f5cf70;border-radius:22px;padding:18px;background:radial-gradient(ellipse at 50% 0%,#6d4a1c,#161b2a 75%);box-shadow:inset 0 3px 8px #fff6,0 8px 30px #0009}.trophy{font-size:52px;filter:drop-shadow(3px 6px 2px #0009)}.alertTitle{font-size:18px;color:#ffdf84;font-weight:900}.alertName{font-size:clamp(24px,6vw,42px);font-weight:900}.alertAmount{font-size:clamp(20px,5vw,32px);color:#ffe28e;font-weight:900}.confetti{position:absolute;inset:-40px;overflow:hidden;pointer-events:none}.piece{position:absolute;top:-25px;width:9px;height:15px;background:linear-gradient(135deg,#fff5a1,#b77b1c);border-radius:3px;box-shadow:2px 3px 4px #0006;animation:fall 2.8s linear forwards}@keyframes fall{to{transform:translate3d(var(--dx),340px,0) rotate(720deg);opacity:0}}.rankings{margin-top:9px;display:grid;gap:5px}.rank{display:flex;align-items:center;gap:5px;font-size:clamp(10px,2.2vw,17px);text-align:left;white-space:nowrap}.rank span{overflow:hidden;text-overflow:ellipsis;flex:1}.rank b{color:#ffe1a0;font-size:.9em}.leader{min-height:120px}.alertSubtitle{font-size:clamp(13px,3vw,21px);font-weight:900;color:#ffe8b0;letter-spacing:.09em;margin:6px 0}.alert.legend .alertCard{border-color:#fff0a8;box-shadow:0 0 45px #f8b733aa,inset 0 3px 15px #fff7;animation:legendPulse 1.1s ease-in-out 3}.alert.legend .trophy{font-size:70px}@keyframes legendPulse{50%{transform:scale(1.035);filter:brightness(1.3)}}</style><style>
.alertCard{border:0;background:radial-gradient(ellipse at 50% 48%,#170e08ed 0%,#110b07bd 36%,transparent 73%);box-shadow:none;padding:24px 12px}
.alert.legend .alertCard{box-shadow:none;animation:none}
.alert .trophy{margin:0 auto 8px;width:clamp(88px,22vw,224px);position:relative;filter:drop-shadow(0 0 18px #ffc66680)}
.trophy img{display:block;width:100%;max-height:32vh;object-fit:contain}
.alert.show .trophy{animation:ramy-trophy 3s ease-out both}
.alertTitle,.alertName,.alertAmount,.alertSubtitle{text-shadow:0 2px 8px #000,0 1px 3px #000}
.alertName{overflow-wrap:anywhere}
@keyframes ramy-trophy{0%{opacity:0;transform:translateY(18px) scale(.76);filter:brightness(.55) drop-shadow(0 0 3px #ffc66650)}28%{opacity:1;transform:translateY(0) scale(1);filter:brightness(1.23) drop-shadow(0 0 22px #ffc666b0)}100%{transform:scale(1.06);filter:brightness(1) drop-shadow(0 0 14px #ffc66670)}}
@media(prefers-reduced-motion:reduce){.alert.show .trophy{animation:none}}
</style><style>
.alert{--glow:#ffc666;--burst:#f5cf70;--angle:110deg}
.alert[data-tier="bronze"]{--glow:#d69163;--burst:#e9a672}
.alert[data-tier="silver"]{--glow:#a7d8ff;--burst:#e9f6ff}
.alert[data-tier="gold"]{--glow:#ffd262;--burst:#ffe599}
.alert[data-tier="legend"]{--glow:#e9b4ff;--burst:#fff0b0}
.alert .trophy img{filter:drop-shadow(0 0 14px var(--glow))}
.alert .piece{background:linear-gradient(var(--angle),#fff9e6,var(--burst))}
.alertCard{position:relative;isolation:isolate}
.alertCard::before{content:"";position:absolute;inset:-28%;z-index:-1;pointer-events:none;opacity:0;background:linear-gradient(var(--angle),transparent 35%,var(--glow) 50%,transparent 65%);mask-image:radial-gradient(ellipse,#000 0%,transparent 66%)}
.alert.show:not([data-tier="bronze"]) .alertCard::before{animation:ramy-spotlight 1.8s ease-out both}
.alert.show[data-tier="legend"] .alertCard::before{animation:ramy-spotlight 2.6s ease-out 3}
@keyframes ramy-spotlight{0%{transform:translateX(-16%) scale(.8);opacity:0}35%{opacity:.6}100%{transform:translateX(16%) scale(1.2);opacity:0}}
@media(prefers-reduced-motion:reduce){.alert.show .alertCard::before{animation:none!important}}

function alertTone(output, frequency, endFrequency, time, duration, volume, type) {
  const oscillator = audioContext.createOscillator();
  const envelope = audioContext.createGain();
  oscillator.type = type;
  oscillator.frequency.setValueAtTime(frequency, time);
  oscillator.frequency.exponentialRampToValueAtTime(endFrequency, time + duration);
  envelope.gain.setValueAtTime(0.001, time);
  envelope.gain.exponentialRampToValueAtTime(volume, time + 0.018);
  envelope.gain.exponentialRampToValueAtTime(0.001, time + duration);
  oscillator.connect(envelope).connect(output);
  oscillator.start(time);
  oscillator.stop(time + duration);
}
async function sound(tier) {
  if (q.has('mute')) return;
  const Audio = window.AudioContext || window.webkitAudioContext;
  if (!Audio) return;
  try {
    audioContext ??= new Audio();
    if (audioContext.state !== 'running') await audioContext.resume();
    const output = audioContext.createDynamicsCompressor();
    output.connect(audioContext.destination);
    const time = audioContext.currentTime + 0.02;
    const tone = (freq, target, delay, duration, volume, type = 'sine') =>
      alertTone(output, freq, target, time + delay, duration, volume, type);
    if (tier === 'bronze') {
      tone(390, 650, 0, 0.19, 0.12, 'triangle');
      tone(535, 840, 0.16, 0.23, 0.10, 'triangle');
      tone(1260, 1175, 0.27, 0.36, 0.056);
    } else {
      const impact = tier === 'legend' ? 0.25 : tier === 'gold' ? 0.17 : 0.09;
      tone(116, 43, 0, 0.48, impact);
      tone(260, 90, 0, 0.20, impact * 0.45, 'triangle');
      tone(300, 1500, 0.11, 0.55, 0.06, 'triangle');
      const chord = {silver:[440,554,659], gold:[392,494,587,784], legend:[262,392,523,659,784,1047]}[tier];
      chord.forEach((freq, i) => {
        tone(freq, freq, 0.4 + i * 0.07, 0.74, 0.07, 'triangle');
        tone(freq * 2.01, freq * 2, 0.42 + i * 0.07, 0.42, 0.023);
        tone(freq, freq, 0.58 + i * 0.07, 0.6, 0.016);
      });
      if (tier === 'legend') tone(92, 44, 0.44, 0.83, 0.16);
    }
    setTimeout(() => output.disconnect(), 2300);
  } catch (error) {
    console.warn('Kutlama sesi çalınamadı', error);
  }
}
function celebrate(name,amount,champ){const n=Number(amount)||0,legend=n>=1000;safe('title',legend?'👑 EFSANE ŞAMPİYON!':champ?'👑 YENİ ŞAMPİYON!':'🎉 SÜPER CHAT!');safe('subtitle',legend?'BU GECEYE DAMGA VURDUN!':n>=500?'SÜPER ŞAMPİYON!':n>=100?'YENİ YILDIZIMIZ SAHNEDE!':'Bıdık’ın mama parası çıkmak üzere… Bir pati kaldı!');safe('sender',name);safe('money',money(n));const el=document.getElementById('alert'),cf=document.getElementById('confetti');el.dataset.tier=legend?'legend':n>=500?'gold':n>=100?'silver':'bronze';el.style.setProperty('--angle',(75+Math.random()*65)+'deg');cf.replaceChildren();for(let i=0;i<(legend?96:n>=500?64:n>=100?36:14);i++){let p=document.createElement('i');p.className='piece';p.style.left=(Math.random()*100)+'%';p.style.animationDelay=(Math.random()*1.5)+'s';p.style.setProperty('--dx',((Math.random()-.5)*250)+'px');cf.appendChild(p)}el.classList.toggle('legend',legend);el.classList.add('show');void sound(el.dataset.tier);clearTimeout(window.alertTimeout);window.alertTimeout=setTimeout(()=>{el.classList.remove('show');el.classList.remove('legend')},legend?10000:n>=500?7000:n>=100?5000:3000)}
const API='https://ramy-sampiyonlar-ligi-api.mizenrahman.workers.dev/leaders';function renderRanks(board,items){const el=document.getElementById(board);if(!el)return;el.replaceChildren();const medals=['🥇','🥈','🥉'];for(let i=0;i<3;i++){const row=document.createElement('div');row.className='rank';const item=Array.isArray(items)?items[i]:null;const name=document.createElement('span');name.textContent=item?.name||item?.supporter_name||'Henüz yok';const amount=document.createElement('b');amount.textContent=item&&Number.isFinite(Number(item.amount??item.total_try))?money(item.amount??item.total_try):'—';if (i === 0 && item?.name) {
  const crown = document.createElement('i');
  crown.className = 'leader-crown';
  crown.setAttribute('role', 'img');
  crown.setAttribute('aria-label', 'Lider');
  row.append(crown, name, amount);
} else {
  row.append(document.createTextNode(medals[i]+' '),name,amount);
}el.append(row)}}const seenDonations = new Map();
const alertQueue = [];
let alertsReady = false;
let playingAlert = false;
let refreshing = false;

function playNextAlert() {
  const donation = alertQueue.shift();
  if (!donation) {
    playingAlert = false;
    return;
  }
  playingAlert = true;
  celebrate(donation.name, donation.amount, false);
  const duration = donation.amount >= 1000 ? 10000 : donation.amount >= 500 ? 7000 : donation.amount >= 100 ? 5000 : 3000;
  setTimeout(playNextAlert, duration + 250);
}

function updateAlerts(recent) {
  if (!Array.isArray(recent)) return;
  const now = Date.now();
  for (const [id, lastSeen] of seenDonations) {
    if (now - lastSeen > 10 * 60_000) seenDonations.delete(id);
  }
  for (const donation of recent.slice().reverse()) {
    if (!donation.id || !Number.isFinite(donation.amount)) continue;
    if (alertsReady && !seenDonations.has(donation.id)) alertQueue.push(donation);
    seenDonations.set(donation.id, now);
  }
  alertsReady = true;
  if (!playingAlert) playNextAlert();
}

async function refreshLeaders(){if(refreshing)return;refreshing=true;try{const response=await fetch(API,{cache:'no-store'});if(!response.ok)throw Error('API '+response.status);const data=await response.json();renderRanks('daily',data.day);renderRanks('weekly',data.week);if(!q.has('test'))updateAlerts(data.recent)}catch(err){console.warn('Liderlik verileri alınamadı',err)}finally{refreshing=false}}refreshLeaders();setInterval(refreshLeaders,15000);if(q.has('test')){
  const button=document.createElement('button');
  button.textContent='Kutlamayı sesli oynat';
  button.style.cssText='position:fixed;bottom:8%;left:50%;transform:translateX(-50%);z-index:5;padding:12px 20px;border:0;border-radius:8px;background:#ffdc83;color:#211608;font-weight:bold';
  button.addEventListener('click',()=>celebrate(q.get('sender')||'Örnek İzleyici',q.get('amount')||100,q.has('champ')));
  document.body.append(button);
}</script></body></html>
