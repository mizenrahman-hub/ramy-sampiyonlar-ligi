function alertTone(output, frequency, endFrequency, time, duration, volume, type) {
  const oscillator = audioContext.createOscillator();
  const envelope = audioContext.createGain();
  oscillator.type = type;
  oscillator.frequency.setValueAtTime(frequency, time);
  oscillator.frequency.exponentialRampToValueAtTime(endFrequency, time + duration);
  envelope.gain.setValueAtTime(0.001, time);
  envelope.gain.exponentialRampToValueAtTime(volume, time + 0.018);
  envelope.gain.exponentialRampToValueAtTime(0.001, time + duration);

  oscillator.start(time);
  oscillator.stop(time + duration);

let previousBidikMove;
const bidikRepliks = new Map();

function nextBidikMoment(name, requestedMove) {
  const available = bidikMoves.filter(([move]) => move !== previousBidikMove);
  const [move, symbol, lines] = bidikMoves.find(([id]) => id === requestedMove) ||
    available[Math.floor(Math.random() * available.length)];
  previousBidikMove = move;

  const previous = bidikRepliks.get(move);
  const remaining = previous?.remaining.length ? previous.remaining : [...lines];
  const choices = remaining.length > 1 ? remaining.filter(line => line !== previous?.line) : remaining;
  const line = choices[Math.floor(Math.random() * choices.length)];
  remaining.splice(remaining.indexOf(line), 1);
  bidikRepliks.set(move, {line, remaining});
  return {move, symbol, text: line.replace('{name}', () => name)};
}

const stageMessages = new Map();
function selectStageMessage(stage, name) {
  const previous = stageMessages.get(stage.amount);
  const remaining = previous?.remaining.length ? previous.remaining : [...stage.lines];
  const choices = remaining.length > 1 ? remaining.filter(line => line !== previous?.line) : remaining;
  const line = choices[Math.floor(Math.random() * choices.length)];
  remaining.splice(remaining.indexOf(line), 1);
  const opening = previous?.opening === 'ring' ? 'sweep' : 'ring';
  stageMessages.set(stage.amount, {line, remaining, opening});
  return {opening: q.has('test') && q.get('art') === 'new' ? 'ring' : opening, line:line.replace('{name}', () => name)};
}

const alertQueue = [];
let alertsReady = false;
let playingAlert = false;

function playNextAlert() {

  if (!donation) {
    playingAlert = false;
    return;
  }
  playingAlert = true;
  const boards = donation.boards || [];
  const title = boards.length === 2 ? 'Çifte Şampiyon!' : boards[0] === 'daily' ? 'Yeni Günün Şampiyonu!' : boards[0] === 'weekly' ? 'Yeni Haftanın Şampiyonu!' : '';

  setTimeout(playNextAlert, ALERT_DURATION_MS + (boards.length ? CROWN_DURATION_MS : 0) + 250);
}

const donationLeaders = {};
function updateAlerts(recent, data) {
  if (!Array.isArray(recent)) return;
  const now = Date.now();
  for (const [id, lastSeen] of seenDonations) {
    if (now - lastSeen > 10 * 60_000) seenDonations.delete(id);
  }
  const fresh = recent.filter(donation => donation.id && !seenDonations.has(donation.id) && Number.isFinite(donation.amount));
  const crowns = new Map();
  for (const [board, items] of [['daily', data.day], ['weekly', data.week]]) {
    const leader = items?.[0];
    const previous = donationLeaders[board];
    donationLeaders[board] = leader?.supporter_id || null;
    if (!alertsReady || !leader?.supporter_id || previous === leader.supporter_id) continue;
    if (items.filter(item => item.name === leader.name).length !== 1) continue;
    const matches = fresh.filter(donation => donation.name === leader.name);
    if (matches.length !== 1) continue;
    const id = matches[0].id;
    crowns.set(id, [...(crowns.get(id) || []), board]);
  }
  for (const donation of recent.slice().reverse()) {
    if (!donation.id || !Number.isFinite(donation.amount)) continue;
    if (alertsReady && !seenDonations.has(donation.id)) alertQueue.push({...donation, boards:crowns.get(donation.id)});
    seenDonations.set(donation.id, now);
  }
  alertsReady = true;
  if (!playingAlert) playNextAlert();
}

      void line.offsetWidth;
      line.classList.add('chat-crowning');
      chatCrownTimers.set(line, setTimeout(() => {
        crown.remove();
        line.classList.remove('chat-crowning');
      }, 1600));
    }
  });
}
async function refreshLeaders(){if(refreshing)return;refreshing=true;try{const response=await fetch(API,{cache:'no-store'});if(!response.ok)throw Error('API '+response.status);const data=await response.json();renderRanks('daily',data.day);renderRanks('weekly',data.week);renderChatStar('daily','Günün Sohbet Yıldızı',data.chat?.day);renderChatStar('weekly','Haftanın Sohbet Yıldızı',data.chat?.week);if(q.has('finale'))showWeekFinale(data);else if(!q.has('test'))updateAlerts(data.recent,data)}catch(err){console.warn('Liderlik verileri alınamadı',err)}finally{refreshing=false}}refreshLeaders();setInterval(refreshLeaders,15000);if(q.has('test')){
  const button=document.createElement('button');
  button.textContent=q.has('chat-crown')?'Beyaz tacı göster':q.has('bidik')?'Bıdık’ı göster':'Kutlamayı sesli oynat';
  button.style.cssText='position:fixed;bottom:8%;left:50%;transform:translateX(-50%);z-index:5;padding:12px 20px;border:0;border-radius:8px;background:#ffdc83;color:#211608;font-weight:bold';
  button.addEventListener('click',()=>{
    if (q.has('chat-crown')) {
      renderChatStar('daily','Günün Sohbet Yıldızı',[{name:'@ornek_izleyici',points:99}]);
      renderChatStar('daily','Günün Sohbet Yıldızı',[{name:'@yeni_sohbet_yildizi',points:100}]);
      return;
    }
    celebrate(q.get('sender')||'Örnek İzleyici',q.get('amount')||(q.has('bidik')?55:100),'',q.has('champ')?[q.get('champ')==='weekly'?'weekly':'daily']:[]);
  });
  document.body.append(button);
}</script></body></html>
